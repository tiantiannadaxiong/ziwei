<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="fg-title fg-desc">
  <title id="fg-title">重陽辭青歌 · 一枝光陰</title>
  <desc id="fg-desc">一枝深墨老木自左下伸向右上，空枝、褐金的舊葉與石綠新芽依著自然葉序生長。舊葉有蟲孔和乾捲邊緣，嫩葉細薄透光；枝下只留淡淡的水痕，讓四季的時間在同一株植物上相逢。</desc>
