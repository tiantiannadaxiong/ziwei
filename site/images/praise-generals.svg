    <linearGradient id="pg-mount" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#326B75" stop-opacity=".38"/><stop offset=".65" stop-color="#6F8F76" stop-opacity=".18"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".025"/></linearGradient>
