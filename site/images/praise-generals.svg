<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="pg-title pg-desc">
  <title id="pg-title">讚將 · 江流英名</title>
  <desc id="pg-desc">長江穿過層疊青山，明亮水面向東舒展。岸上戰馬駐足，遠營旗影隨風；近處長刀與畫戟斜立，一盞溫酒留在石上，英雄往事融入江流與紙白。</desc>
