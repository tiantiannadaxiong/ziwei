<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">添丁賀 · 春滿暖巢</title>
  <desc id="desc">蒼老的花枝托住一窩新生，粉白春花錯落開放。一隻石青春燕俯身照看探頭的雛鳥，另一隻掠過空闊春光；遠岸的暖窗、淡山與湖水，寄託古稀得孫、三代相親的喜悅。</desc>
  <defs>
    <linearGradient id="tg-water" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#326B75" stop-opacity="0"/><stop offset=".5" stop-color="#326B75" stop-opacity=".09"/><stop offset="1" stop-color="#6F8F76" stop-opacity="0"/></linearGradient>
    <radialGradient id="tg-light"><stop stop-color="#D7B56D" stop-opacity=".14"/><stop offset="1" stop-color="#D7B56D" stop-opacity="0"/></radialGradient>
    <linearGradient id="tg-wood" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#263D34" stop-opacity=".91"/><stop offset=".55" stop-color="#566454" stop-opacity=".86"/><stop offset="1" stop-color="#87947B" stop-opacity=".67"/></linearGradient>
    <linearGradient id="tg-wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263D34"/><stop offset=".45" stop-color="#326B75"/><stop offset="1" stop-color="#203F49"/></linearGradient>
    <linearGradient id="tg-breast" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#FAEDCF"/><stop offset=".65" stop-color="#E3D6B7"/><stop offset="1" stop-color="#B4B49B"/></linearGradient>
    <linearGradient id="tg-petal" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#F9ECE2"/><stop offset=".62" stop-color="#EACCC3"/><stop offset="1" stop-color="#CB9696"/></linearGradient>
    <linearGradient id="tg-nest" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#BCA477"/><stop offset=".42" stop-color="#9D8E67"/><stop offset="1" stop-color="#5A6650"/></linearGradient>
