<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="wild-title wild-desc">
  <title id="wild-title">狂野 · 風雨過簷</title>
  <desc id="wild-desc">一角深墨屋簷迎著急雨，右側秋樹被狂風吹向一旁。銅紅與秋赭落葉在斜雨間翻飛，遠山隱入層疊雨霧；石地積水映著簷影，斷枝與碎瓦留在風雨過後。</desc>
  <defs>
    <linearGradient id="wi-mist" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#326B75" stop-opacity=".02"/><stop offset=".5" stop-color="#738C82" stop-opacity=".14"/><stop offset="1" stop-color="#326B75" stop-opacity=".025"/></linearGradient>
    <linearGradient id="wi-hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6F8F76" stop-opacity=".15"/><stop offset="1" stop-color="#6F8F76" stop-opacity="0"/></linearGradient>
    <linearGradient id="wi-wall" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#526D61" stop-opacity=".16"/><stop offset=".6" stop-color="#6F8F76" stop-opacity=".07"/><stop offset="1" stop-color="#6F8F76" stop-opacity="0"/></linearGradient>
    <linearGradient id="wi-floor" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#326B75" stop-opacity=".02"/><stop offset=".58" stop-color="#326B75" stop-opacity=".17"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".035"/></linearGradient>
    <linearGradient id="wi-bark" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#263D34"/><stop offset=".5" stop-color="#6A7966"/><stop offset="1" stop-color="#435B50"/></linearGradient>
    <linearGradient id="wi-leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C1A169"/><stop offset=".55" stop-color="#AA7955"/><stop offset="1" stop-color="#805849"/></linearGradient>
  </defs>
