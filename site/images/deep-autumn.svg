    <linearGradient id="da-bank" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#8C977A" stop-opacity=".75"/><stop offset="1" stop-color="#435D4B" stop-opacity=".9"/></linearGradient>
  </defs>

