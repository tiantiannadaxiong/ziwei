<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">深秋 · 天水一線</title>
  <desc id="desc">左岸近處的楓枝分組伸向江面，秋赭、暗紅與尚綠的葉片疏密相間；右岸林影漸遠，兩岸之間只餘一線明亮天光。紅葉的斷影穿入青綠秋水，一位極小的行人立在岸邊。</desc>
  <defs>
    <linearGradient id="da-ridge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#839B89" stop-opacity=".32"/><stop offset="1" stop-color="#A9B7A2" stop-opacity="0"/></linearGradient>
    <linearGradient id="da-water" x1=".4" y1="0" x2=".6" y2="1"><stop stop-color="#6F8F76" stop-opacity=".05"/><stop offset=".31" stop-color="#6F8F76" stop-opacity=".22"/><stop offset=".76" stop-color="#326B75" stop-opacity=".34"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".09"/></linearGradient>
    <linearGradient id="da-bark" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#263D34"/><stop offset=".45" stop-color="#5B6650"/><stop offset=".74" stop-color="#7E8060"/><stop offset="1" stop-color="#3C5140"/></linearGradient>
    <linearGradient id="da-rust" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#BE8C61" stop-opacity=".62"/><stop offset=".55" stop-color="#A8664E" stop-opacity=".78"/><stop offset="1" stop-color="#805849" stop-opacity=".8"/></linearGradient>
