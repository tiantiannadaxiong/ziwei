    <linearGradient id="km-mountain" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#326B75" stop-opacity=".26"/><stop offset=".65" stop-color="#6F8F76" stop-opacity=".12"/><stop offset="1" stop-color="#6F8F76" stop-opacity="0"/></linearGradient>
