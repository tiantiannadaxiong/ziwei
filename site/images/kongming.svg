<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="km-title km-desc">
  <title id="km-title">西蜀丞相孔明篇 · 羽扇遺芳</title>
  <desc id="km-desc">層疊青山隱入紙白，山下的祠宇半掩於蒼柏。近景石案上，一柄羽扇斜倚攤開的書卷，孤燈尚暖；上方一顆淡金微星，與山間空白遙相呼應。</desc>
