<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="gw-title gw-desc">
  <title id="gw-title">長城 · 楓間望古</title>
  <desc id="gw-desc">近處紅楓枝葉以秋赭、暗紅與少量尚綠相映，枝間留出遠望的空隙。古長城與方形烽臺沿青綠山脊蜿蜒，從近處的石牆漸次收細，消隱在遠山、薄霧與紙白之間。</desc>
