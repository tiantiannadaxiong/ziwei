<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="as-title as-desc">
  <title id="as-title">秋歌 · 菊岸秋聲</title>
  <desc id="as-desc">秋菊在近岸黃草與濕石間開放，溪水從金黃收穫田地旁緩緩流過。遠處幾間村舍、疏雲、淡月與一行雁影退入青綠薄霧，明亮的秋收與綿長的秋思共留於紙白。</desc>
  <defs>
    <linearGradient id="as-sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6F8F76" stop-opacity="0"/><stop offset=".5" stop-color="#6F8F76" stop-opacity=".09"/><stop offset="1" stop-color="#326B75" stop-opacity=".025"/></linearGradient>
    <linearGradient id="as-far" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6F8F76" stop-opacity=".2"/><stop offset="1" stop-color="#6F8F76" stop-opacity="0"/></linearGradient>
    <linearGradient id="as-ridge" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#6F8F76" stop-opacity=".37"/><stop offset=".65" stop-color="#326B75" stop-opacity=".11"/><stop offset="1" stop-color="#6F8F76" stop-opacity="0"/></linearGradient>
    <linearGradient id="as-water" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#326B75" stop-opacity=".035"/><stop offset=".55" stop-color="#326B75" stop-opacity=".23"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".08"/></linearGradient>
    <linearGradient id="as-field" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#D3BB7E" stop-opacity=".22"/><stop offset=".5" stop-color="#C6A466" stop-opacity=".55"/><stop offset="1" stop-color="#B59255" stop-opacity=".15"/></linearGradient>
    <linearGradient id="as-bank" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#8C977A" stop-opacity=".44"/><stop offset=".6" stop-color="#526D61" stop-opacity=".65"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".08"/></linearGradient>
    <linearGradient id="as-rock" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#84977E"/><stop offset="1" stop-color="#435B50"/></linearGradient>
    <radialGradient id="as-moon"><stop stop-color="#FFFDF5" stop-opacity=".7"/><stop offset="1" stop-color="#FFFDF5" stop-opacity="0"/></radialGradient>
  </defs>
