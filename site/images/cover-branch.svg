    <path d="M317 507c8-16 18-34 18-52-1-15-9-29-5-45 3-16 16-25 25-38 10-14 14-30 16-48 2 21-3 39-13 54-8 12-19 23-21 35-2 16 6 29 5 44-1 21-12 41-19 54Z"/>
