    <path d="M339 412c17-10 31-18 39-34l11-12 4-20 6-12c-1 18-4 28-11 39l-6 14c-9 13-22 20-42 31Z"/>
    <path d="M437 452c22 2 44 6 64 13 17 6 34 6 49 1 17-6 27-16 45-19-18 7-27 17-44 23-15 6-33 6-52 1-20-5-40-10-64-13Z"/>
    <path d="M487 461c1-21 0-35-9-52-6-11-12-18-17-29 9 9 16 18 21 29 9 18 10 32 9 54Z"/>
    <path d="M549 389c8-20 8-40 2-59-5-17-13-31-15-48-3-22 6-39 15-58-5 21-10 39-8 57 2 17 12 32 17 49 6 20 4 41-4 61Z"/>
    <path d="M551 316c17-10 21-22 22-35l9-13-4 14c0 18-10 30-25 40Z"/>
    <path d="M632 328c11 4 23 8 35 7 15-1 29-10 39-17 16-13 29-17 48-17-18 4-30 11-43 22-12 10-24 18-41 20-16 1-28-3-42-6Z"/>
    <path d="M688 302c7-20 8-38 4-59-4-18-3-30 1-45 0 18-1 30 3 43 6 22 4 41-2 61Z"/>
    <path d="M762 239c3-17 0-32-8-48-8-16-10-29-8-46 1 18 7 30 14 43 9 17 11 34 8 51Z"/>
    <path d="M822 204c14 3 25 3 38-3 15-7 26-10 40-9-18 3-27 9-39 15-13 6-27 6-41 3Z"/>
    <path d="M868 183c7-18 14-29 26-39 8-7 13-15 15-27 1 14-3 23-12 31-11 11-17 22-24 37Z"/>
    <path d="M930 151c9-3 16-1 25 1-10 1-16 1-28 3Z"/>
  </g>
  <g fill="none" stroke="#91AC72" stroke-opacity=".46" stroke-linecap="round" stroke-width="1">
    <path d="M185 559c4-18 5-33 2-46m151-54c-1-16-6-28-4-40m220-46c3-14 2-28-2-42m144-66c0-10-1-18-2-27m68-13c0-12-2-21-8-32"/>
  </g>
  <g fill="#715540">
    <path d="m227 538-6-16 9 10 9 1Zm48-21 1-15 5 12Zm106-42-4-16 9 9Zm80-41-3-12 8 8Zm170-104 1-13 5 9Zm204-124 10 1-8 3Z"/>
  </g>

  <!-- A full white flower: five different petal silhouettes, not a rosette. -->
  <g transform="translate(328 443)">
    <path d="M1 2c-10-1-18-8-18-17 0-6 5-12 11-10 7 2 9 14 7 27Z" fill="url(#petal)" stroke="#D29479" stroke-width=".7"/>
    <path d="M0 1c-1-13 4-25 12-28 6-2 12 3 11 9-2 9-13 16-23 19Z" fill="#FFFDF5" stroke="#D29479" stroke-width=".7"/>
    <path d="M2 1c11-5 22-4 26 3 4 7-1 14-8 14-8 0-14-7-18-17Z" fill="url(#petal)" stroke="#D29479" stroke-width=".7"/>
    <path d="M1 1c8 7 10 17 5 23-4 6-13 7-17 1-4-7 0-17 12-24Z" fill="#FFE9CE" stroke="#D29479" stroke-width=".7"/>
    <path d="M0 2c-6 9-16 12-23 7-6-5-6-12 0-15 7-4 16 0 23 8Z" fill="url(#petal)" stroke="#D29479" stroke-width=".7"/>
    <path d="M-5 6-9 11M0 5l2 10M3 4l9 8M3 0l11-4M1-3l3-11M-2-3l-7-8M-4 1l-11 1" fill="none" stroke="#B18D67" stroke-width=".72" stroke-linecap="round"/>
    <g fill="#B78A38"><circle cx="-9" cy="11" r="1.3"/><circle cx="2" cy="15" r="1.15"/><circle cx="12" cy="12" r="1.15"/><circle cx="14" cy="-4" r="1.15"/><circle cx="4" cy="-14" r="1.2"/><circle cx="-9" cy="-11" r="1.2"/><circle cx="-15" cy="2" r="1.1"/></g>
    <path d="M-4 0q5-5 9 1l-3 5Z" fill="#D98A70"/>
  </g>

  <!-- A near-side rose blossom still holds its folded cup. -->
  <g transform="translate(174 499) rotate(-15)">
    <path d="M1 9c-13-2-20-10-18-20 1-5 6-8 9-5 5 5 8 15 9 25Z" fill="url(#rose)" stroke="#C9826B" stroke-width=".65"/>
    <path d="M1 8c-7-10-8-22-2-28 4-4 11-2 11 4 0 9-4 17-9 24Z" fill="#FFCEB4" stroke="#C9826B" stroke-width=".65"/>
    <path d="M2 8C8-5 17-11 22-7c6 5 1 16-20 15Z" fill="#ED977E" stroke="#C9826B" stroke-width=".65"/>
    <path d="M-7 3c6-4 11-5 17-2" fill="none" stroke="#F7F3E8" stroke-opacity=".9" stroke-width="1.1"/>
    <path d="M-6 7 1 12l9-7-2 10-6-1-5 4Z" fill="#879858"/>
    <path d="M2 14 0 27" stroke="#715540" stroke-width="1.3"/>
  </g>

  <!-- A turned flower opens toward the unpainted page. -->
  <g transform="translate(480 392) rotate(21)">
    <path d="M-1 5c-8-1-17-5-18-13-1-5 3-9 8-7 6 2 8 12 10 20Z" fill="url(#petal)" stroke="#D29479" stroke-width=".65"/>
    <path d="M-1 5c-7-10-8-22-2-26 6-4 12 2 11 8-1 7-6 13-9 18Z" fill="#FFFDF5" stroke="#D29479" stroke-width=".65"/>
    <path d="M0 5c1-10 9-18 15-16 7 2 6 10 1 14-4 4-9 5-16 2Z" fill="url(#petal)" stroke="#D29479" stroke-width=".65"/>
    <path d="M-2 5c6 6 13 7 18 4-2 7-12 8-17 3Z" fill="#F2BD9D"/>
    <path d="M-5 8 2 12l7-6-2 9-9 1Z" fill="#8C9D62"/>
    <path d="M-1 5-6-6m8 9 3-13M3 5l8-7" fill="none" stroke="#AA8964" stroke-width=".7"/>
    <g fill="#B29369"><circle cx="-6" cy="-6" r="1.2"/><circle cx="5" cy="-10" r="1.1"/><circle cx="11" cy="-2" r="1.2"/></g>
  </g>

  <!-- A smaller, almost white bloom seen obliquely. -->
  <g transform="translate(690 285) rotate(-26)">
    <path d="M0 1c-10-1-16-7-13-13 4-7 11-2 13 13Z" fill="#FFFDF5" stroke="#D29479" stroke-width=".6"/>
    <path d="M0 0c-4-11-1-21 5-20 8 1 7 13-5 20Z" fill="url(#petal)" stroke="#D29479" stroke-width=".6"/>
    <path d="M0 0c7-10 17-12 20-6 3 7-6 12-20 6Z" fill="#FFFDF5" stroke="#D29479" stroke-width=".6"/>
    <path d="M1 1c12-1 19 5 14 11-5 6-12 0-14-11Z" fill="url(#petal)" stroke="#D29479" stroke-width=".6"/>
    <path d="M0 1c3 10-1 17-7 16-7-2-5-12 7-16Z" fill="#F7CCA9" stroke="#D29479" stroke-width=".6"/>
    <path d="M-1 1-8-5m8 3 1-10m3 10 8-4M4 2l7 5M0 4l-3 7" fill="none" stroke="#AC8A63" stroke-width=".65"/>
    <g fill="#BA8D3E"><circle cx="-8" cy="-5" r="1"/><circle cx="1" cy="-12" r="1"/><circle cx="12" cy="-6" r="1"/><circle cx="11" cy="7" r="1"/><circle cx="-3" cy="11" r="1"/></g>
    <circle r="2.5" fill="#D28D70"/>
  </g>

  <!-- The last flowers are small: a half-open cup, a bud, and a spent calyx. -->
  <g transform="translate(755 182) rotate(-24)">
    <path d="M0 7c-9-3-15-12-11-17 5-6 12 4 11 17Z" fill="url(#rose)" stroke="#CA8E70" stroke-width=".6"/>
    <path d="M0 7c-2-10 2-19 8-17 7 3 3 14-8 17Z" fill="#FFE7C6" stroke="#CA8E70" stroke-width=".6"/>
    <path d="M1 8c4-7 12-10 15-4 2 6-7 10-15 4Z" fill="#F4B59C" stroke="#CA8E70" stroke-width=".6"/>
    <path d="M-4 7 2 11l6-4-1 8-8 1Z" fill="#8C9D62"/>
  </g>
  <g transform="translate(889 143) rotate(38)">
    <path d="M0 8c-7-5-8-14-2-18 7-1 12 7 2 18Z" fill="#E88B76" stroke="#B77D63" stroke-width=".6"/>
    <path d="M-2-7c3 1 5 4 5 7" fill="none" stroke="#FFE5BC" stroke-width="1.2"/>
    <path d="m-4 4 4 7 5-6-1 9-6-1Z" fill="#7C904F"/>
  </g>
  <path d="m401 340-6-5 3 10 7-1 3-8-6 3m153-112-5-7 1 11 6 2 5-6-6 1m344-35-5-5 3 8 7 1 3-6-7 2" fill="#9B9E60"/>
  <path d="M399 337c-4-2-6-6-3-9 3-2 7 1 6 5Z" fill="#DF8E73"/>
  <path d="M548 220c-5-6-4-12 0-15 5 1 7 8 0 15Z" fill="#EDAD8D"/>


  <!-- Sparse lichen, fresh buds and fallen petals carry the only small accents. -->
  <g fill="#91AC72" fill-opacity=".63">
    <path d="m104 607 6-4 3 3-5 4Zm13-6 3-2 2 2-4 2Zm139-56 5-4 4 2-3 5Zm11-7 4-2 2 2-3 2Zm271-142 5-4 3 2-4 4Zm11-9 3-2 2 1-1 3Z"/>
