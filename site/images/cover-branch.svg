<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">牆角疏梅 · 暗香自來</title>
  <desc id="desc">取意《梅花》：暖白院牆在冬光裡轉折，幾枝老梅迎寒獨開。暖白與桃粉花瓣似雪而有生意，珊瑚花苞映著杏金光，薄雪停在牆沿與地面，暗香留在明亮的空白之間。</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#715540"/>
      <stop offset=".52" stop-color="#8A7050"/>
      <stop offset="1" stop-color="#A58B5E"/>
    </linearGradient>
    <linearGradient id="petal" x1=".25" y1="0" x2=".6" y2="1">
      <stop stop-color="#FFF7DE"/>
      <stop offset=".74" stop-color="#FFD9B8"/>
      <stop offset="1" stop-color="#EEAB88"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#FFD7C4"/>
      <stop offset=".75" stop-color="#F3A08A"/>
      <stop offset="1" stop-color="#DD7867"/>
    </linearGradient>
    <radialGradient id="winter-light">
      <stop stop-color="#FFDB9E" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#F8C9A4" stop-opacity=".12"/>
      <stop offset="1" stop-color="#F8C9A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall-light" x1=".25" y1="0" x2=".5" y2="1">
      <stop stop-color="#F8DDB0" stop-opacity=".65"/>
      <stop offset=".48" stop-color="#F0D5B2" stop-opacity=".42"/>
      <stop offset="1" stop-color="#F7F3E8" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="wall-side" x1="1" y1=".1" x2="0" y2="1">
      <stop stop-color="#CBB697" stop-opacity=".41"/>
      <stop offset=".6" stop-color="#DDCDB5" stop-opacity=".3"/>
      <stop offset="1" stop-color="#F7F3E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="snow-ground" x1="0" y1="0" x2=".9" y2=".1">
      <stop stop-color="#D4C6AC" stop-opacity="0"/>
      <stop offset=".36" stop-color="#C7CDB5" stop-opacity=".14"/>
      <stop offset=".74" stop-color="#E6BC83" stop-opacity=".11"/>
      <stop offset="1" stop-color="#E6BC83" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Winter light is diffuse: warmth belongs to the paper, without a moon. -->
  <ellipse cx="675" cy="297" rx="329" ry="262" fill="url(#winter-light)"/>
  <!-- Two softly weathered planes meet at the garden corner. -->
  <path d="m71 319 178 56-2 238-172-60Z" fill="url(#wall-side)"/>
  <path d="m249 375 634-118-3 241-633 115Z" fill="url(#wall-light)"/>
  <path d="m70 319 178 53 636-117-5 10-628 118-181-57Z" fill="#F5E4C9" fill-opacity=".78"/>
  <path d="m72 318 176 51 115-20m43-8 138-26m39-7 147-27m40-8 110-20" fill="none" stroke="#FFFDF6" stroke-width="5.6" stroke-linecap="round" stroke-opacity=".88"/>
  <path d="m249 384-1 75m0 26-1 62m0 19v29" fill="none" stroke="#AD9677" stroke-width="1.25" stroke-opacity=".29"/>
  <path d="m79 329 155 48m33 2 91-17m207-38 87-16m104-20 94-16" fill="none" stroke="#C5A279" stroke-width="1" stroke-opacity=".24"/>
  <!-- Small plaster marks stay local; the wall fades before it becomes a frame. -->
  <g fill="none" stroke-linecap="round">
    <path d="m288 431 38-6m-33 13 16-3m63 73 32-5m213-122 38-7m-27 13 18-3m103 60 29-4m-209 71 35-7" stroke="#D5B78E" stroke-opacity=".3" stroke-width="1"/>
    <path d="m110 386 24 7m40 85 21 6m-79 29 17 4" stroke="#AE9D85" stroke-opacity=".21" stroke-width=".85"/>
    <path d="m351 464 62-12m221-22 52-10m-229 99 57-11" stroke="#FFF9EA" stroke-opacity=".76" stroke-width="1.8"/>
  </g>
  <!-- A little snow lends meaning to the white petals, leaving the scene light. -->
  <path d="M92 612c107-13 176 4 266-1 124-8 239-43 355-49 75-4 133-11 198-24-80 29-139 34-206 40-112 9-227 46-347 47-102 2-171-10-266-6Z" fill="url(#snow-ground)"/>
  <path d="M110 640c91-20 167-10 244-9 113 2 198-26 286-32 77-5 137-5 203-18-55 21-110 24-173 29-106 9-186 35-302 33-91-2-163-9-258-3Z" fill="#FFFDF6" fill-opacity=".69"/>
  <path d="M203 650c49-7 78-4 114-3m78-5 69-7m107-17 45-5m112-21 61-6" fill="none" stroke="#C6B494" stroke-opacity=".24" stroke-width="1" stroke-linecap="round"/>

