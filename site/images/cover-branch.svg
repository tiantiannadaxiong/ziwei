  <path d="M-24 650c42-24 80-43 120-61l23-15 14-1c27-12 48-25 74-35 17-7 34-11 51-16l9-10 15 1c20-8 32-20 50-28l21-3c20-9 37-24 55-35 18-11 36-15 57-23l15-13 16-3c29-16 54-42 79-61l19-8 12-13c28-17 58-24 86-41 20-12 29-31 47-47l18-7 12-14c27-18 59-22 86-37 28-16 44-33 70-58-17 26-35 45-63 63-25 15-56 20-82 37l-18 19-12 7c-19 17-33 39-54 53-26 17-55 24-81 41l-15 17-18 9c-25 20-48 47-76 63l-25 8-17 11c-17 8-34 14-50 25-20 13-36 28-59 36l-17 13-20 3c-19 9-34 19-56 26l-18 4-14 10c-29 12-52 20-80 35-29 15-50 28-80 41-38 17-69 38-105 63l-29-15Z" fill="url(#wood)"/>
  <path d="M0 645c39-19 70-33 101-45l26-15c31-10 59-29 86-38m19-6c25-6 42-13 61-22l28-15 23-8m21-10c23-9 43-29 64-40l40-15m16-9c13-5 22-13 33-20m24-15c18-12 31-26 45-37" fill="none" stroke="#91AC72" stroke-opacity=".4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 649c41-19 63-24 95-36m19-9c14-7 28-15 38-19m52-25c31-15 43-18 59-23m38-20c18-5 34-12 51-20m98-53c19-13 32-17 48-25" fill="none" stroke="#F7F3E8" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M86 604c2 6 7 8 12 9m104-69c6 6 10 7 15 6m107-45c2 6 6 8 10 8m89-59c6 3 9 4 13 2m77-42c0 4 4 6 7 7m93-78c4 5 7 6 12 4m65-43c2 3 5 5 8 5" fill="none" stroke="#604431" stroke-opacity=".7" stroke-width="1.4"/>
  <path d="M109 604c11-5 20-6 30-10-9 1-15 1-22 2Zm194-88 18-9-11 10Zm100-49 13-13-5 15Zm141-64 17-14-9 14Z" fill="#F7F3E8" fill-opacity=".55"/>

