<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">秋月 · 天涯共此光</title>
  <desc id="desc">一輪紙白秋月照著寬闊的水面。左側山腳下退著香港的輕淡樓影，右側另一段水岸留有巴黎低屋頂與樹影；兩端空間以同一層清冷月色相呼應，沒有地標拼貼，只有疏落的水上明痕。</desc>
  <defs>
    <radialGradient id="am-moon" cx=".43" cy=".37" r=".64"><stop offset=".68" stop-color="#FFFDF5" stop-opacity=".96"/><stop offset=".96" stop-color="#FFFDF5" stop-opacity=".72"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".055"/></radialGradient>
    <linearGradient id="am-air" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#326B75" stop-opacity="0"/><stop offset=".5" stop-color="#326B75" stop-opacity=".055"/><stop offset="1" stop-color="#6F8F76" stop-opacity="0"/></linearGradient>
    <linearGradient id="am-water" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#326B75" stop-opacity="0"/><stop offset=".33" stop-color="#326B75" stop-opacity=".075"/><stop offset=".73" stop-color="#326B75" stop-opacity=".19"/><stop offset="1" stop-color="#326B75" stop-opacity=".015"/></linearGradient>
    <linearGradient id="am-hill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6F8F76" stop-opacity=".42"/><stop offset=".6" stop-color="#6F8F76" stop-opacity=".16"/><stop offset="1" stop-color="#6F8F76" stop-opacity="0"/></linearGradient>
    <linearGradient id="am-quay" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6F8F76" stop-opacity=".13"/><stop offset="1" stop-color="#263D34" stop-opacity=".47"/></linearGradient>
  </defs>

