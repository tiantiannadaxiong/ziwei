    <linearGradient id="jl-rock" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#839B89" stop-opacity=".8"/><stop offset=".7" stop-color="#435B50" stop-opacity=".88"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".04"/></linearGradient>
    <linearGradient id="jl-bark" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#263D34"/><stop offset=".6" stop-color="#6B7054"/><stop offset="1" stop-color="#435B50"/></linearGradient>
