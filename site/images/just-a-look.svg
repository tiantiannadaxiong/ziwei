<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="jl-title jl-desc">
  <title id="jl-title">看一下 · 楓隙桂影</title>
  <desc id="jl-desc">一枝紅楓從右上方探入，秋紅與淺赭葉片在近處疏密相映。枝葉間望見桂林石峰，青綠峰林由近及遠漸淡入薄霧；江水映著斷續山影，一葉小竹筏輕輕掠過，留住不忍眨眼的一瞬。</desc>
  <defs>
    <linearGradient id="jl-far" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6F8F76" stop-opacity=".18"/><stop offset="1" stop-color="#6F8F76" stop-opacity="0"/></linearGradient>
    <linearGradient id="jl-middle" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#6F8F76" stop-opacity=".43"/><stop offset=".7" stop-color="#326B75" stop-opacity=".16"/><stop offset="1" stop-color="#6F8F76" stop-opacity="0"/></linearGradient>
    <linearGradient id="jl-near" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#435B50" stop-opacity=".7"/><stop offset=".5" stop-color="#6F8F76" stop-opacity=".57"/><stop offset="1" stop-color="#8EA18B" stop-opacity=".4"/></linearGradient>
    <linearGradient id="jl-water" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#326B75" stop-opacity=".04"/><stop offset=".6" stop-color="#326B75" stop-opacity=".25"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".075"/></linearGradient>
