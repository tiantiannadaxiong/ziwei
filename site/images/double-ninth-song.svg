    <linearGradient id="dn-slope" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#9BA78B" stop-opacity=".44"/><stop offset=".55" stop-color="#6F8F76" stop-opacity=".55"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".08"/></linearGradient>
