<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="dn-title dn-desc">
  <title id="dn-title">九九歌 · 山徑菊香</title>
  <desc id="dn-desc">一條淺色山徑在青赭秋山間曲折上行，消失於遠處的空明。一叢金菊依著近坡開放，花瓣或舒或捲，墨綠葉片承接秋風；高空只有幾點遠雁。</desc>
