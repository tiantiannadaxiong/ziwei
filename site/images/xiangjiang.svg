    <linearGradient id="xj-far" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#879B8B" stop-opacity=".34"/><stop offset="1" stop-color="#A4B5A3" stop-opacity=".03"/></linearGradient>
    <linearGradient id="xj-mountain" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#5F7E6B" stop-opacity=".74"/><stop offset=".64" stop-color="#6F8F76" stop-opacity=".45"/><stop offset="1" stop-color="#8DA590" stop-opacity=".08"/></linearGradient>
    <linearGradient id="xj-water" x1="0" y1=".06" x2=".22" y2="1"><stop stop-color="#326B75" stop-opacity=".04"/><stop offset=".33" stop-color="#6F8F76" stop-opacity=".16"/><stop offset=".72" stop-color="#326B75" stop-opacity=".32"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".08"/></linearGradient>
    <linearGradient id="xj-cliff" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#80947A" stop-opacity=".82"/><stop offset=".56" stop-color="#4B6857" stop-opacity=".94"/><stop offset="1" stop-color="#263D34"/></linearGradient>
