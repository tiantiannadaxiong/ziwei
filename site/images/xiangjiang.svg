<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">香江 · 西風過港</title>
  <desc id="desc">西風吹過寬闊港面，石青與石綠的浪脊斜向舒展。錯落兩岸退入山腳，細小樓影藏在霧色中；右下近崖與一線白沙承接明亮水光，遠山層層而高。</desc>
