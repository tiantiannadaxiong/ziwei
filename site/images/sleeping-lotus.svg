<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">睡蓮 · 秋水無聲</title>
  <desc id="desc">空闊秋水間，一朵粉蓮俯首，成熟蓮房微傾。翻捲、殘缺的荷葉以石綠與淡墨舒展，細莖和疏水痕留住深秋的靜睡。</desc>
