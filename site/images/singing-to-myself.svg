<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="sm-title sm-desc">
  <title id="sm-title">自吟 · 白沙細浪</title>
  <desc id="sm-desc">清冷海色向遠方淡入紙白，一抹初月懸於空闊天際。白沙岸自左上斜落右下，薄浪隨岸線緩緩舒展；濕沙、斷續潮痕與幾枚低小礫石讓海聲和冥想有了節奏。</desc>
  <defs>
    <linearGradient id="sm-sea" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#326B75" stop-opacity=".025"/><stop offset=".34" stop-color="#326B75" stop-opacity=".13"/><stop offset=".7" stop-color="#326B75" stop-opacity=".32"/><stop offset="1" stop-color="#326B75" stop-opacity=".55"/></linearGradient>
    <linearGradient id="sm-shallow" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#6F8F76" stop-opacity=".14"/><stop offset=".55" stop-color="#73A198" stop-opacity=".4"/><stop offset="1" stop-color="#326B75" stop-opacity=".17"/></linearGradient>
    <linearGradient id="sm-sand" x1="0" y1=".2" x2="1" y2="1"><stop stop-color="#D8CDB0" stop-opacity=".025"/><stop offset=".55" stop-color="#C3B58E" stop-opacity=".15"/><stop offset="1" stop-color="#BDA77A" stop-opacity=".22"/></linearGradient>
    <linearGradient id="sm-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F3E8" stop-opacity=".2"/><stop offset=".5" stop-color="#F7F3E8" stop-opacity=".67"/><stop offset="1" stop-color="#FFFDF5" stop-opacity=".9"/></linearGradient>
    <linearGradient id="sm-stone" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#A1A58A"/><stop offset="1" stop-color="#536E61"/></linearGradient>
    <radialGradient id="sm-moon-air"><stop stop-color="#C4CEC3" stop-opacity=".11"/><stop offset="1" stop-color="#C4CEC3" stop-opacity="0"/></radialGradient>
  </defs>
