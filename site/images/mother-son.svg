<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">母子情 · 寸草與遠燈</title>
  <desc id="desc">春光照著近岸的細草，水面在兩岸之間留下寬闊的距離。遠岸一所半掩在樹影裡的家只亮著一扇小窗，微暖的倒影止於岸下；草葉迎光舒展，遠燈靜靜等候。</desc>
  <defs>
    <linearGradient id="ms-water" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#326B75" stop-opacity="0"/><stop offset=".45" stop-color="#326B75" stop-opacity=".075"/><stop offset=".76" stop-color="#326B75" stop-opacity=".13"/><stop offset="1" stop-color="#326B75" stop-opacity=".025"/></linearGradient>
    <linearGradient id="ms-bank" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#263D34" stop-opacity=".75"/><stop offset=".55" stop-color="#6F8F76" stop-opacity=".39"/><stop offset="1" stop-color="#A5B18D" stop-opacity=".08"/></linearGradient>
    <linearGradient id="ms-spring" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#C8BC83" stop-opacity=".16"/><stop offset=".6" stop-color="#C8BC83" stop-opacity=".055"/><stop offset="1" stop-color="#C8BC83" stop-opacity="0"/></linearGradient>
    <linearGradient id="ms-leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ADB68B"/><stop offset=".42" stop-color="#7F9A73"/><stop offset="1" stop-color="#45664C"/></linearGradient>
    <radialGradient id="ms-lamp"><stop stop-color="#D7B56D" stop-opacity=".26"/><stop offset=".4" stop-color="#D7B56D" stop-opacity=".09"/><stop offset="1" stop-color="#D7B56D" stop-opacity="0"/></radialGradient>
  </defs>

