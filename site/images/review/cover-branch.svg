<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">疏影，未顯之香</title>
  <desc id="desc">一枝老梅從清淺的水邊橫斜而起，枯潤的枝身間疏疏開著白梅與淡粉梅。紙白的月色隱在枝後，水中只留下斷續的墨影與花影。</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2=".9" y2=".3">
      <stop stop-color="#6F8F76" stop-opacity="0"/>
      <stop offset=".37" stop-color="#6F8F76" stop-opacity=".075"/>
      <stop offset=".72" stop-color="#326B75" stop-opacity=".065"/>
      <stop offset="1" stop-color="#326B75" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx=".4" cy=".38" r=".64">
      <stop offset=".6" stop-color="#FFFDF5" stop-opacity=".8"/>
      <stop offset=".94" stop-color="#FFFDF5" stop-opacity=".5"/>
      <stop offset="1" stop-color="#6F8F76" stop-opacity=".025"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#263D34"/>
      <stop offset=".52" stop-color="#35463B"/>
      <stop offset="1" stop-color="#4C5848"/>
    </linearGradient>
    <linearGradient id="petal" x1=".25" y1="0" x2=".6" y2="1">
      <stop stop-color="#FFFDF5"/>
      <stop offset=".74" stop-color="#F1E7DC"/>
      <stop offset="1" stop-color="#D7ACA0"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#F0DAD3"/>
      <stop offset=".75" stop-color="#D9AAA2"/>
      <stop offset="1" stop-color="#C48782"/>
    </linearGradient>
  </defs>

  <!-- Light is left as paper, not a luminous object laid over it. -->
  <circle cx="812" cy="222" r="106" fill="url(#moon)" opacity=".68"/>
  <path d="M750 137c23-17 53-22 81-18 26 3 48 15 64 35" fill="none" stroke="#6F8F76" stroke-opacity=".09" stroke-width=".8"/>
  <path d="M889 281c-17 24-42 38-71 42" fill="none" stroke="#6F8F76" stroke-opacity=".075" stroke-width=".7"/>

  <!-- A shallow wash has open edges; long unpainted passages remain water. -->
  <path d="M150 578c102-40 207-37 308-19 88 15 148-18 247-16 88 2 161-8 236-26-42 31-96 46-144 53 62 4 114 1 177-10-69 27-139 34-204 35-113 1-173 30-282 13-100-15-194-9-282 16 38-24 84-39 127-42-69-4-121-1-183 14Z" fill="url(#water)"/>
  <path d="M95 635c94-16 185-7 267 3 97 12 194 0 269-10 100-13 212-9 306-23-117 31-207 30-301 42-99 12-174 17-267 4-81-10-177-15-274-16Z" fill="#6F8F76" fill-opacity=".038"/>
