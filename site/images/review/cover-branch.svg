  <g transform="translate(328 443)">
    <path d="M1 2c-10-1-18-8-18-17 0-6 5-12 11-10 7 2 9 14 7 27Z" fill="url(#petal)" stroke="#C7A396" stroke-width=".7"/>
    <path d="M0 1c-1-13 4-25 12-28 6-2 12 3 11 9-2 9-13 16-23 19Z" fill="#FFFDF5" stroke="#C7A396" stroke-width=".7"/>
