    <path d="M1 1c8 7 10 17 5 23-4 6-13 7-17 1-4-7 0-17 12-24Z" fill="#F3E9DF" stroke="#C7A396" stroke-width=".7"/>
    <path d="M0 2c-6 9-16 12-23 7-6-5-6-12 0-15 7-4 16 0 23 8Z" fill="url(#petal)" stroke="#C7A396" stroke-width=".7"/>
    <path d="M-5 6-9 11M0 5l2 10M3 4l9 8M3 0l11-4M1-3l3-11M-2-3l-7-8M-4 1l-11 1" fill="none" stroke="#B18D67" stroke-width=".72" stroke-linecap="round"/>
    <g fill="#A27B50"><circle cx="-9" cy="11" r="1.3"/><circle cx="2" cy="15" r="1.15"/><circle cx="12" cy="12" r="1.15"/><circle cx="14" cy="-4" r="1.15"/><circle cx="4" cy="-14" r="1.2"/><circle cx="-9" cy="-11" r="1.2"/><circle cx="-15" cy="2" r="1.1"/></g>
    <path d="M-4 0q5-5 9 1l-3 5Z" fill="#BC8F81"/>
  </g>

