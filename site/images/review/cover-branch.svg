  <path d="M585 516c7-7 15-5 15 0-1 5-8 7-15 0Z" fill="#E4BCB1" fill-opacity=".76"/>
  <path d="M665 584c3-6 10-8 13-4-1 5-6 7-13 4Z" fill="#E0B5AC" fill-opacity=".67"/>
