  <path d="M0 645c39-19 70-33 101-45l26-15c31-10 59-29 86-38m19-6c25-6 42-13 61-22l28-15 23-8m21-10c23-9 43-29 64-40l40-15m16-9c13-5 22-13 33-20m24-15c18-12 31-26 45-37" fill="none" stroke="#6F8F76" stroke-opacity=".4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 649c41-19 63-24 95-36m19-9c14-7 28-15 38-19m52-25c31-15 43-18 59-23m38-20c18-5 34-12 51-20m98-53c19-13 32-17 48-25" fill="none" stroke="#F7F3E8" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M86 604c2 6 7 8 12 9m104-69c6 6 10 7 15 6m107-45c2 6 6 8 10 8m89-59c6 3 9 4 13 2m77-42c0 4 4 6 7 7m93-78c4 5 7 6 12 4m65-43c2 3 5 5 8 5" fill="none" stroke="#1F332D" stroke-opacity=".7" stroke-width="1.4"/>
