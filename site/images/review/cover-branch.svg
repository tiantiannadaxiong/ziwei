  <!-- Snowfall begins: additions leave the original painting intact. -->
  <defs>
    <g id="snow-crystal" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0-9V9M-7.8-4.5 7.8 4.5M-7.8 4.5 7.8-4.5M-2.8-6 0-3.8 2.8-6M-2.8 6 0 3.8 2.8 6M-6.5-1.5-3.3-1.9-4.5-5M6.5 1.5 3.3 1.9 4.5 5M-6.5 1.5-3.3 1.9-4.5 5M6.5-1.5 3.3-1.9 4.5-5" stroke="#D4D9D0" stroke-width="1.9" stroke-opacity=".28"/>
