      <path d="M0 1C-4 16-18 21-23 12-29 2-14-4 0 1Z" fill="url(#ivory)"/>
      <path d="M-3-3-7-12M1-4l4-12M4-2l11-4M4 2l12 5M1 5l3 11M-3 4l-9 9M-5 0l-11 1" fill="none" stroke="#AC8660" stroke-width=".8" stroke-linecap="round"/>
      <g fill="#B68B50"><circle cx="-7" cy="-12" r="1.6"/><circle cx="5" cy="-16" r="1.3"/><circle cx="15" cy="-6" r="1.5"/><circle cx="16" cy="7" r="1.3"/><circle cx="4" cy="16" r="1.4"/><circle cx="-12" cy="13" r="1.3"/><circle cx="-16" cy="1" r="1.4"/></g>
      <path d="m-4-2 5-2 4 5-5 4-4-3Z" fill="#CA927F"/>
    </g>
    <g id="pink">
      <path d="M0 1C-13-3-17-17-9-21 0-25 6-12 0 1Z" fill="url(#blush)"/>
      <path d="M0 0C-2-13 7-23 14-18 24-11 11-2 0 0Z" fill="#F4CDBB"/>
      <path d="M1 0C14-7 27-2 23 6 18 17 6 10 1 0Z" fill="url(#blush)"/>
      <path d="M1 1C14 8 12 22 4 23-7 24-6 9 1 1Z" fill="#E5AA97"/>
      <path d="M0 1C-4 16-19 17-22 8-24-3-10-5 0 1Z" fill="url(#blush)"/>
      <path d="M-3-2-8-11M1-3l5-10M3 0l11-2M2 3l8 10M-2 4l-6 10M-4 1l-11 3" fill="none" stroke="#956E4F" stroke-width=".8" stroke-linecap="round"/>
      <g fill="#A57D3E"><circle cx="-8" cy="-11" r="1.4"/><circle cx="6" cy="-13" r="1.4"/><circle cx="14" cy="-2" r="1.2"/><circle cx="10" cy="13" r="1.4"/><circle cx="-6" cy="14" r="1.3"/><circle cx="-15" cy="4" r="1.3"/></g><circle r="3" fill="#B16B60"/>
    </g>
    <g id="cup">
