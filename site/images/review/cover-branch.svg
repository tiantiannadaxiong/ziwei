<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 90 600 740" role="img" aria-labelledby="title desc">
  <title id="title">疏梅有香</title>
  <desc id="desc">暖白冬光裡，院牆只留淡淡轉角。老梅從左下曲折生長，兩叢疏枝向上、向右舒展，粉白與淡胭脂的花有開有合。疏密有別的雪點與細緻雪花緩緩飄落，細枝間留出大片空白，幾點花苞和地上的落瓣含蓄呼應，不題詩，不加框。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#E9D7B7" stop-opacity=".38"/><stop offset=".55" stop-color="#EADBC2" stop-opacity=".15"/><stop offset="1" stop-color="#F7F3E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="return" x1="0" y1="0" x2="1" y2=".1">
      <stop stop-color="#C9C5B8" stop-opacity=".2"/><stop offset="1" stop-color="#E2DCCF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="light"><stop stop-color="#F2D0A5" stop-opacity=".25"/><stop offset="1" stop-color="#F7F3E8" stop-opacity="0"/></radialGradient>
    <linearGradient id="bark" x1="0" y1="1" x2=".6" y2="0"><stop stop-color="#746557"/><stop offset=".5" stop-color="#84715E"/><stop offset="1" stop-color="#A48A6C"/></linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#FFFEF6"/><stop offset=".6" stop-color="#FFF2E2"/><stop offset="1" stop-color="#E9BAA3"/></linearGradient>
    <linearGradient id="blush" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FCE6D8"/><stop offset=".7" stop-color="#E9AC9C"/><stop offset="1" stop-color="#CA8276"/></linearGradient>
    <linearGradient id="bud" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9AC9C"/><stop offset="1" stop-color="#AF625B"/></linearGradient>
