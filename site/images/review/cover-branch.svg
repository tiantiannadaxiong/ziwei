  <g transform="translate(174 499) rotate(-15)">
    <path d="M1 9c-13-2-20-10-18-20 1-5 6-8 9-5 5 5 8 15 9 25Z" fill="url(#rose)" stroke="#B6867E" stroke-width=".65"/>
    <path d="M1 8c-7-10-8-22-2-28 4-4 11-2 11 4 0 9-4 17-9 24Z" fill="#F0D7CE" stroke="#B6867E" stroke-width=".65"/>
    <path d="M2 8C8-5 17-11 22-7c6 5 1 16-20 15Z" fill="#D2A095" stroke="#B6867E" stroke-width=".65"/>
    <path d="M-7 3c6-4 11-5 17-2" fill="none" stroke="#F7F3E8" stroke-opacity=".9" stroke-width="1.1"/>
    <path d="M-6 7 1 12l9-7-2 10-6-1-5 4Z" fill="#59674E"/>
    <path d="M2 14 0 27" stroke="#263D34" stroke-width="1.3"/>
  </g>

  <!-- A turned flower opens toward the unpainted page. -->
  <g transform="translate(480 392) rotate(21)">
    <path d="M-1 5c-8-1-17-5-18-13-1-5 3-9 8-7 6 2 8 12 10 20Z" fill="url(#petal)" stroke="#C7A396" stroke-width=".65"/>
    <path d="M-1 5c-7-10-8-22-2-26 6-4 12 2 11 8-1 7-6 13-9 18Z" fill="#FFFDF5" stroke="#C7A396" stroke-width=".65"/>
    <path d="M0 5c1-10 9-18 15-16 7 2 6 10 1 14-4 4-9 5-16 2Z" fill="url(#petal)" stroke="#C7A396" stroke-width=".65"/>
    <path d="M-2 5c6 6 13 7 18 4-2 7-12 8-17 3Z" fill="#DFC1B4"/>
    <path d="M-5 8 2 12l7-6-2 9-9 1Z" fill="#65745D"/>
    <path d="M-1 5-6-6m8 9 3-13M3 5l8-7" fill="none" stroke="#AA8964" stroke-width=".7"/>
    <g fill="#B29369"><circle cx="-6" cy="-6" r="1.2"/><circle cx="5" cy="-10" r="1.1"/><circle cx="11" cy="-2" r="1.2"/></g>
  </g>

  <!-- A smaller, almost white bloom seen obliquely. -->
  <g transform="translate(690 285) rotate(-26)">
    <path d="M0 1c-10-1-16-7-13-13 4-7 11-2 13 13Z" fill="#FFFDF5" stroke="#C7A396" stroke-width=".6"/>
    <path d="M0 0c-4-11-1-21 5-20 8 1 7 13-5 20Z" fill="url(#petal)" stroke="#C7A396" stroke-width=".6"/>
    <path d="M0 0c7-10 17-12 20-6 3 7-6 12-20 6Z" fill="#FFFDF5" stroke="#C7A396" stroke-width=".6"/>
    <path d="M1 1c12-1 19 5 14 11-5 6-12 0-14-11Z" fill="url(#petal)" stroke="#C7A396" stroke-width=".6"/>
    <path d="M0 1c3 10-1 17-7 16-7-2-5-12 7-16Z" fill="#E9D4C7" stroke="#C7A396" stroke-width=".6"/>
    <path d="M-1 1-8-5m8 3 1-10m3 10 8-4M4 2l7 5M0 4l-3 7" fill="none" stroke="#AC8A63" stroke-width=".65"/>
    <g fill="#A98456"><circle cx="-8" cy="-5" r="1"/><circle cx="1" cy="-12" r="1"/><circle cx="12" cy="-6" r="1"/><circle cx="11" cy="7" r="1"/><circle cx="-3" cy="11" r="1"/></g>
    <circle r="2.5" fill="#B78F7F"/>
  </g>

  <!-- The last flowers are small: a half-open cup, a bud, and a spent calyx. -->
  <g transform="translate(755 182) rotate(-24)">
    <path d="M0 7c-9-3-15-12-11-17 5-6 12 4 11 17Z" fill="url(#rose)" stroke="#BD8E83" stroke-width=".6"/>
    <path d="M0 7c-2-10 2-19 8-17 7 3 3 14-8 17Z" fill="#F4E7DC" stroke="#BD8E83" stroke-width=".6"/>
    <path d="M1 8c4-7 12-10 15-4 2 6-7 10-15 4Z" fill="#E6C6BC" stroke="#BD8E83" stroke-width=".6"/>
    <path d="M-4 7 2 11l6-4-1 8-8 1Z" fill="#65745D"/>
  </g>
  <g transform="translate(889 143) rotate(38)">
    <path d="M0 8c-7-5-8-14-2-18 7-1 12 7 2 18Z" fill="#C8948A" stroke="#9A7770" stroke-width=".6"/>
    <path d="M-2-7c3 1 5 4 5 7" fill="none" stroke="#F4DFD5" stroke-width="1.2"/>
    <path d="m-4 4 4 7 5-6-1 9-6-1Z" fill="#56654E"/>
  </g>
  <path d="m401 340-6-5 3 10 7-1 3-8-6 3m153-112-5-7 1 11 6 2 5-6-6 1m344-35-5-5 3 8 7 1 3-6-7 2" fill="#6A6D51"/>
  <path d="M399 337c-4-2-6-6-3-9 3-2 7 1 6 5Z" fill="#BD8B81"/>
  <path d="M548 220c-5-6-4-12 0-15 5 1 7 8 0 15Z" fill="#D4AAA0"/>

