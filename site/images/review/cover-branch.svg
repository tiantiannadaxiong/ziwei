  <style>
    .snow-drift{animation:plum-snow 28s linear infinite;pointer-events:none}
    .snow-drift.far{animation-duration:41s;animation-delay:-17s}
    .snow-drift.middle{animation-duration:31s;animation-delay:-8s}
    .snow-drift.near{animation-duration:25s;animation-delay:-19s}
    .snow-drift.crystals{animation-duration:34s;animation-delay:-13s}
    @keyframes plum-snow{0%{transform:translate(-6px,-25px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(9px,29px);opacity:0}}
    @media(prefers-reduced-motion:reduce){.snow-drift{animation:none;transform:none;opacity:1}}
  </style>
