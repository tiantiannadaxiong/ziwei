<g id="snow-middle" class="snow-drift middle" fill="#FFFEFA" fill-opacity="0.88"><ellipse cx="154" cy="243" rx="2.6" ry="3.07"/><ellipse cx="275" cy="158" rx="2.3" ry="2.71"/><ellipse cx="484" cy="113" rx="2.4" ry="2.83"/><ellipse cx="559" cy="213" rx="2.5" ry="2.95"/><ellipse cx="636" cy="365" rx="2.4" ry="2.83"/><ellipse cx="346" cy="323" rx="2.5" ry="2.95"/><ellipse cx="179" cy="426" rx="2.2" ry="2.60"/><ellipse cx="454" cy="476" rx="2.6" ry="3.07"/><ellipse cx="533" cy="422" rx="2.3" ry="2.71"/><ellipse cx="289" cy="550" rx="2.5" ry="2.95"/><ellipse cx="650" cy="594" rx="2.2" ry="2.60"/><ellipse cx="408" cy="615" rx="2.6" ry="3.07"/><ellipse cx="238" cy="709" rx="2.3" ry="2.71"/><ellipse cx="514" cy="765" rx="2.6" ry="3.07"/></g>
