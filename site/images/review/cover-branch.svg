      <path d="M0 8C-7-5-4-20 4-19 14-17 9-1 0 8Z" fill="url(#ivory)"/>
      <path d="M1 8C5-5 17-13 22-6 27 2 12 13 1 8Z" fill="#F1BFA9"/>
      <path d="m-8 7 8 9 9-10-2 13-8-2-5 2Z" fill="#8D8C67"/>
      <path d="m0 17-2 13" fill="none" stroke="#85715C" stroke-width="1.7"/>
    </g>
    <g id="closed">
      <path d="M0 7C-10 2-9-12-1-14 8-14 10 0 0 7Z" fill="url(#bud)"/>
      <path d="M-3-10Q2-9 3-3" fill="none" stroke="#F7D5BD" stroke-width="1.1"/>
      <path d="m-6 3 6 9 6-10-1 12-7-2Z" fill="#858264"/>
      <path d="m-1 12-3 9" stroke="#85715C" stroke-width="1.4"/>
    </g>
  </defs>

