    <path d="M205 601c44-3 79 0 118 4m52 4c55 7 102 10 158 5m119-12c55-4 94-4 144-8" stroke="#326B75" stroke-opacity=".22" stroke-width=".85"/>
    <path d="M401 648c47 4 96 1 137-4m-309-1c28-1 53 0 77 2m403-18c42-2 79-3 120-8" stroke="#263D34" stroke-opacity=".14" stroke-width=".65"/>
