  </g>

  <!-- Broken reflections remember the direction of the living branch. -->
  <g fill="#263D34" fill-opacity=".105">
    <path d="M83 655c75-15 128-22 185-19 28 2 48 7 71 9-27 1-50-1-74-2-57-1-113 6-182 16Z"/>
    <path d="M360 651c40 5 67 5 100 1l46 5c-60 7-99 4-146-3Z"/>
    <path d="M521 658c35-3 54-4 84-2l48 11c-47-5-84-7-132-5Z"/>
    <path d="M304 635l22-11 46-3-38 6-15 9Z"/>
