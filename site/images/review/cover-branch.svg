    <path d="M762 239c3-17 0-32-8-48-8-16-10-29-8-46 1 18 7 30 14 43 9 17 11 34 8 51Z"/>
    <path d="M822 204c14 3 25 3 38-3 15-7 26-10 40-9-18 3-27 9-39 15-13 6-27 6-41 3Z"/>
    <path d="M868 183c7-18 14-29 26-39 8-7 13-15 15-27 1 14-3 23-12 31-11 11-17 22-24 37Z"/>
    <path d="M930 151c9-3 16-1 25 1-10 1-16 1-28 3Z"/>
  </g>
  <g fill="none" stroke="#6F8F76" stroke-opacity=".46" stroke-linecap="round" stroke-width="1">
    <path d="M185 559c4-18 5-33 2-46m151-54c-1-16-6-28-4-40m220-46c3-14 2-28-2-42m144-66c0-10-1-18-2-27m68-13c0-12-2-21-8-32"/>
