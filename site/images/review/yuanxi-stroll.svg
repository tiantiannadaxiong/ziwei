<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="yuanxi-title yuanxi-desc">
  <title id="yuanxi-title">元夕逛街 · 燈影與空巷</title>
  <desc id="yuanxi-desc">元宵的舊街向左前方迂迴而去。近處簷下的一盞長燈、遠處兩點燈火，在淺色石路留下斷續暖影。一位極小的行人在街角停步，空巷與衣影相伴。</desc>
  <defs>
    <linearGradient id="yx-wall" x1="0" y1="0" x2="1" y2=".25">
      <stop stop-color="#263D34" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#326B75" stop-opacity=".065"/>
      <stop offset="1" stop-color="#326B75" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="yx-quiet-wall" x1="0" y1="0" x2=".5" y2="1">
      <stop stop-color="#326B75" stop-opacity=".045"/>
      <stop offset="1" stop-color="#326B75" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="yx-road" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#B59255" stop-opacity=".015"/>
      <stop offset=".52" stop-color="#B59255" stop-opacity=".085"/>
      <stop offset="1" stop-color="#326B75" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="yx-lantern" x1="0" y1="0" x2="1" y2=".1">
      <stop stop-color="#B44D3B" stop-opacity=".95"/>
      <stop offset=".24" stop-color="#C56946" stop-opacity=".88"/>
      <stop offset=".58" stop-color="#DDB46F" stop-opacity=".84"/>
      <stop offset="1" stop-color="#B44D3B" stop-opacity=".94"/>
    </linearGradient>
    <radialGradient id="yx-warmth">
      <stop stop-color="#E8CA86" stop-opacity=".27"/>
      <stop offset=".48" stop-color="#E8CA86" stop-opacity=".09"/>
      <stop offset="1" stop-color="#E8CA86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yx-floor-light" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#B59255" stop-opacity=".22"/>
      <stop offset="1" stop-color="#B59255" stop-opacity="0"/>
    </linearGradient>
  </defs>

