  <path d="M346 429c-3 3-3 11 0 15 3 2 8 2 10-1 2-4 2-10-1-14Z" fill="#B44D3B" fill-opacity=".55"/>
  <path d="m347 428 8-1m-7 19 6-1 1 8" fill="none" stroke="#B59255" stroke-width=".85"/>

