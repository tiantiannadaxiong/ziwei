<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="lk-title lk-desc">
  <title id="lk-title">嶺南木棉 · 赤焰向天</title>
  <desc id="lk-desc">無葉的木棉老幹向上分枝，赤紅厚瓣花朵在枝梢如焰開放，黝褐花蕊與青灰樹皮相映。下方一朵墜花落在淺赭地面，斷續塵痕與細碎砂礫托住花的分量，枝間留出大片紙白。</desc>
