    <linearGradient id="lk-deep" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#CE7950"/><stop offset=".6" stop-color="#B4513F"/><stop offset="1" stop-color="#8E4439"/></linearGradient>
    <linearGradient id="lk-earth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B59255" stop-opacity=".035"/><stop offset=".5" stop-color="#B59255" stop-opacity=".13"/><stop offset="1" stop-color="#B59255" stop-opacity="0"/></linearGradient>
