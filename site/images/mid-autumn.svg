<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">中秋 · 一窗清寒，一室微暖</title>
  <desc id="desc">冷月停在敞開的窗外，疏枝隨風向右舒展。深墨窗柱與磨潤的窗沿承接室內淺暖，茶盞和一枚切開的月餅安放近處；窗外的青色與室內的溫度在大片紙白中相遇。</desc>
  <defs>
    <radialGradient id="ma-moon" cx=".42" cy=".38" r=".62"><stop offset=".68" stop-color="#FFFDF5" stop-opacity=".9"/><stop offset=".96" stop-color="#FFFDF5" stop-opacity=".5"/><stop offset="1" stop-color="#326B75" stop-opacity=".045"/></radialGradient>
    <linearGradient id="ma-air" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#326B75" stop-opacity="0"/><stop offset=".62" stop-color="#326B75" stop-opacity=".055"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".1"/></linearGradient>
    <linearGradient id="ma-warm" x1="0" y1="1" x2=".8" y2="0"><stop stop-color="#B59255" stop-opacity=".15"/><stop offset=".62" stop-color="#B59255" stop-opacity=".035"/><stop offset="1" stop-color="#B59255" stop-opacity="0"/></linearGradient>
    <linearGradient id="ma-wood" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#263D34" stop-opacity=".9"/><stop offset=".55" stop-color="#4B5B49" stop-opacity=".78"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".62"/></linearGradient>
    <linearGradient id="ma-tea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B59255" stop-opacity=".5"/><stop offset="1" stop-color="#7E7654" stop-opacity=".74"/></linearGradient>
  </defs>

