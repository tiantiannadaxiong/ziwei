<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 191 226" role="img" aria-labelledby="title desc">
  <title id="title">Mid-Autumn Festival</title>
  <desc id="desc">A clear autumn moon, a fine plum branch, distant hills, and a few warm reflections resting on quiet water.</desc>
  <defs>
    <radialGradient id="moon-halo">
      <stop stop-color="#e9bf72" stop-opacity=".32" />
      <stop offset=".55" stop-color="#e9bf72" stop-opacity=".13" />
      <stop offset="1" stop-color="#e9bf72" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="moon-disc" cx=".35" cy=".28" r=".82">
      <stop stop-color="#fff6df" />
      <stop offset=".72" stop-color="#f1dfb6" />
      <stop offset="1" stop-color="#dfc88f" />
    </radialGradient>
    <linearGradient id="hill-wash" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8da18f" stop-opacity=".38" />
      <stop offset="1" stop-color="#b9c6b8" stop-opacity=".08" />
    </linearGradient>
    <g id="plum-blossom" fill="#fff8e9" stroke="#718678" stroke-width=".34" stroke-linejoin="round">
      <path d="M0 0C-1.7-1.2-2.4-3.4-1.4-4.5C-.3-4.9.5-3.2.5-1.2Z" />
      <path d="M0 0C-1.7-1.2-2.4-3.4-1.4-4.5C-.3-4.9.5-3.2.5-1.2Z" transform="rotate(72)" />
      <path d="M0 0C-1.7-1.2-2.4-3.4-1.4-4.5C-.3-4.9.5-3.2.5-1.2Z" transform="rotate(144)" />
      <path d="M0 0C-1.7-1.2-2.4-3.4-1.4-4.5C-.3-4.9.5-3.2.5-1.2Z" transform="rotate(216)" />
      <path d="M0 0C-1.7-1.2-2.4-3.4-1.4-4.5C-.3-4.9.5-3.2.5-1.2Z" transform="rotate(288)" />
      <circle r=".78" fill="#b95449" stroke="none" />
      <circle cx=".4" cy="-.2" r=".3" fill="#e8c17a" stroke="none" />
    </g>
    <g id="plum-bud" fill="#b95449" stroke="#596f5f" stroke-width=".35">
      <path d="M0 0c-1.6-1.8-1.4-3.7 0-4.2 1.4.5 1.6 2.4 0 4.2Z" />
    </g>
  </defs>
  <g transform="translate(0 266) scale(1 -1)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="159" y="24" width="8" height="16" fill="#b95449" stroke="none" />
    <g fill="#fff8ec" font-family="serif" font-size="4.5" text-anchor="middle" stroke="none">
      <text x="163" y="37" transform="translate(0 74) scale(1 -1)">暗</text>
      <text x="163" y="32" transform="translate(0 64) scale(1 -1)">香</text>
      <text x="163" y="27" transform="translate(0 54) scale(1 -1)">集</text>
    </g>

    <!-- A clear, cold moon beyond the window -->
    <circle cx="78" cy="196" r="39" fill="url(#moon-halo)" stroke="none" />
    <circle cx="78" cy="196" r="23" fill="url(#moon-disc)" stroke="#c7ae7b" stroke-opacity=".46" stroke-width=".5" />
    <path fill="#d5c397" fill-opacity=".25" stroke="none" d="M67 202c2-4 7-5 10-2 2 2 1 5-1 7-4 3-10 1-11-2-.5-1 .3-2 2-3Zm16 8c1-2 3-2 4-1 1 1 0 3-1 3-2 1-4 0-3-2Z" />
    <path stroke="#fff9ea" stroke-width=".64" d="M49 174c12-6 25-8 39-6" />

    <!-- Quiet hills and the moon's long reflection -->
    <path fill="url(#hill-wash)" stroke="none" d="M18 137c18 2 26 14 42 15 13 1 21-8 34-9 15-1 25 9 40 8 13-1 24-9 40-8l-1-13c-15 0-24 9-39 9-15 1-25-10-40-9-14 1-21 10-34 9-16-1-23-13-41-14Z" />
    <path stroke="#738879" stroke-opacity=".68" stroke-width=".62" d="M22 137c18 2 24 14 40 15 13 1 21-8 34-9 15-1 25 9 40 8 13-1 23-9 36-8" />
    <path stroke="#9caf9e" stroke-width=".52" d="M23 128c19 4 33 3 49-1m18 1c15-3 27-2 39 1m15-2c10-2 18-2 27 0" />
    <path fill="#c5d0c1" fill-opacity=".27" stroke="none" d="M20 111c22 7 39 5 58 1 19-4 33-4 51 0 17 4 29 2 44-2l-1-7c-15 3-28 5-45 1-19-4-32-4-51 0-19 4-35 6-56-1Z" />
    <path stroke="#e9e7dc" stroke-width=".7" d="M34 112c18 4 31 4 45 1m16-1c18 4 32 4 49 .5m-97-10c10 2 18 2 28 1m45 1c14 2 25 2 37 0" />
    <path stroke="#6f887a" stroke-opacity=".64" stroke-width=".48" d="M30 103c14 2 25 2 36 0m54 1c13 3 25 2 37-.3" />
    <path stroke="#d8bc82" stroke-opacity=".58" stroke-width=".56" d="M77 108c-3-3-3-6-.8-9m5 7c2-3 2-5 0-8m-8 6c-2-2-2-4-1-6" />
    <path stroke="#aebaa9" stroke-opacity=".68" stroke-width=".42" d="M41 94c8 1 14 1 20 0m54 2c9 1 16 1 23-.5m-83 20c6 1 10 1 15 0" />

    <!-- Plum wood, old and fine, crossing the moon -->
    <path stroke="#657769" stroke-opacity=".78" stroke-width=".82" d="M174 226c-15-9-25-19-34-32-9-13-17-19-28-25-11-6-19-9-28-18" />
    <path stroke="#819184" stroke-opacity=".78" stroke-width=".5" d="M164 214c-13-2-22-7-31-15m-20-30c-12 1-21-3-30-10m31 11c-2-12-8-20-18-27m36 56c1-13-1-22-7-30" />
    <path stroke="#a6b1a1" stroke-opacity=".7" stroke-width=".42" d="M170 222c-14-8-25-17-33-29m-19-22c-11-6-20-10-30-17" />
    <path stroke="#647568" stroke-opacity=".28" stroke-width=".38" d="M154 204c-5-2-8-5-11-9m-21-22c-5-3-10-5-15-6m38 47c-4-4-6-8-7-13" />
    <path fill="#718576" fill-opacity=".52" stroke="none" d="M145 197c-7 1-12 0-17-4 6 .7 10-.4 14-4Zm-28-29c-6 4-11 5-17 3 5-2 8-5 10-10Zm-21-13c-2 6-6 10-12 12 3-5 3-9 1-14Zm-7-5c5-3 8-7 9-13 2 5 1 9-2 14Z" />
    <use href="#plum-blossom" transform="translate(151 199) scale(.72) rotate(17)" opacity=".82" />
    <use href="#plum-blossom" transform="translate(126 177) scale(.66) rotate(-12)" opacity=".7" />
    <use href="#plum-blossom" transform="translate(101 160) scale(.62) rotate(18)" opacity=".76" />
    <use href="#plum-bud" transform="translate(163 209) rotate(35)" opacity=".72" />
    <use href="#plum-bud" transform="translate(87 157) rotate(22)" opacity=".58" />

    <!-- A quiet amber warmth lingers upon the water -->
    <path fill="#e5c998" fill-opacity=".1" stroke="none" d="M50 89c18-4 37-4 55-1 17 3 31 3 47-1v-5c-17 3-31 3-48 0-18-3-37-3-54 1Z" />
    <path stroke="#b49a68" stroke-opacity=".62" stroke-width=".52" d="M67 84c12-2 22-2 33-.5m26 .5c10-1 18-.5 27 1" />
    <path stroke="#f5f0e4" stroke-opacity=".84" stroke-width=".58" d="M43 77c16-2 28-2 42 0m32 0c15-2 27-1 40 1" />
    <path stroke="#9faf9f" stroke-opacity=".58" stroke-width=".42" d="M57 70c10-1 18 0 26 1m47-1c8-.5 15 0 22 1" />
    <path stroke="#d8bc82" stroke-opacity=".42" stroke-width=".46" d="M89 96c-2-2-2-4-.5-6m6 5c2-2 2-4 .5-6m8 6c1-2 1-4 0-5" />
  </g>
</svg>
