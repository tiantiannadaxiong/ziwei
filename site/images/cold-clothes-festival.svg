    <radialGradient id="cc-glow"><stop stop-color="#D8B271" stop-opacity=".23"/><stop offset=".5" stop-color="#D8B271" stop-opacity=".075"/><stop offset="1" stop-color="#D8B271" stop-opacity="0"/></radialGradient>
  </defs>
