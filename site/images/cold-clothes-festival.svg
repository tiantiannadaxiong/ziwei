<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">寒衣節 · 深巷微暖</title>
  <desc id="cc-desc">秋末的舊巷向右上深處轉折，淡青牆面和明亮石路留出清寒的空氣。近牆一簇暖火照見粗陶盆、牆腳與殘紙，煙氣分層繞過檐角，融入巷上紙白；遠處一扇小窗微明。</desc>
  <defs>
    <linearGradient id="cc-left" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#263D34" stop-opacity=".13"/><stop offset=".7" stop-color="#326B75" stop-opacity=".07"/><stop offset="1" stop-color="#326B75" stop-opacity=".015"/></linearGradient>
    <linearGradient id="cc-right" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#6F8F76" stop-opacity=".045"/><stop offset=".6" stop-color="#326B75" stop-opacity=".11"/><stop offset="1" stop-color="#263D34" stop-opacity=".18"/></linearGradient>
    <linearGradient id="cc-floor" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#B59255" stop-opacity=".025"/><stop offset=".55" stop-color="#B59255" stop-opacity=".085"/><stop offset="1" stop-color="#326B75" stop-opacity=".03"/></linearGradient>
    <linearGradient id="cc-smoke" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6F8F76" stop-opacity="0"/><stop offset=".45" stop-color="#738C82" stop-opacity=".12"/><stop offset="1" stop-color="#8D8B70" stop-opacity=".23"/></linearGradient>
