    <linearGradient id="wd-glass" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#E5C78A" stop-opacity=".9"/><stop offset=".55" stop-color="#F4E4B5"/><stop offset="1" stop-color="#CBA164" stop-opacity=".7"/></linearGradient>
    <linearGradient id="wd-bark" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#263D34"/><stop offset=".5" stop-color="#6A7966"/><stop offset="1" stop-color="#435B50"/></linearGradient>
