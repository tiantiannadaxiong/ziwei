<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="wd-title wd-desc">
  <title id="wd-title">話冬日 · 寒巷初燈</title>
  <desc id="wd-desc">暮色與飛雪籠住深巷，枯樹在石路留下橫斜的淡影。近處高懸的街燈透出微暖，裹緊冬衣的行人快步走過；一縷白氣在臉旁散開，積雪、足跡與薄霧漸次融入紙白。</desc>
  <defs>
    <linearGradient id="wd-air" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#326B75" stop-opacity="0"/><stop offset=".48" stop-color="#326B75" stop-opacity=".11"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".025"/></linearGradient>
    <linearGradient id="wd-left" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#526D61" stop-opacity=".19"/><stop offset=".7" stop-color="#326B75" stop-opacity=".09"/><stop offset="1" stop-color="#326B75" stop-opacity=".025"/></linearGradient>
    <linearGradient id="wd-right" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#326B75" stop-opacity=".19"/><stop offset=".65" stop-color="#6F8F76" stop-opacity=".1"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".02"/></linearGradient>
    <linearGradient id="wd-road" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#326B75" stop-opacity=".015"/><stop offset=".62" stop-color="#326B75" stop-opacity=".12"/><stop offset="1" stop-color="#6F8F76" stop-opacity=".025"/></linearGradient>
