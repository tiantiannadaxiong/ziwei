    <linearGradient id="fw-far" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8EAA9D" stop-opacity=".28"/><stop offset=".8" stop-color="#A8BEB0" stop-opacity=".07"/><stop offset="1" stop-color="#A8BEB0" stop-opacity="0"/></linearGradient>
