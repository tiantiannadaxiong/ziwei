<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">離別 · 露盡山外山</title>
  <desc id="desc">近處垂柳從左上斜出，細葉與晨露疏疏落落。左下只見長亭一角，兩位極小的同窗在岸邊停步；空水與淡金晨光把他們和右方層層青山隔開，山外仍有遠山。</desc>
