<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">話端午 · 艾香與東逝水</title>
  <desc id="desc">初夏的江水在濕岸間舒展，遠處淡入紙白。近岸艾草以互生的深裂葉向上生長，灰白葉背與石綠葉面相翻；細水繞過濕石，遠岸低低收住江勢，留下悠長的哀思。</desc>
  <defs>
    <linearGradient id="df-water" x1="0" y1="1" x2=".6" y2="0"><stop stop-color="#326B75" stop-opacity=".24"/><stop offset=".48" stop-color="#326B75" stop-opacity=".12"/><stop offset="1" stop-color="#326B75" stop-opacity="0"/></linearGradient>
    <linearGradient id="df-shore" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#6F8F76" stop-opacity=".06"/><stop offset=".62" stop-color="#6F8F76" stop-opacity=".25"/><stop offset="1" stop-color="#263D34" stop-opacity=".48"/></linearGradient>
    <linearGradient id="df-leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8EA48A"/><stop offset=".48" stop-color="#68856C"/><stop offset="1" stop-color="#385548"/></linearGradient>
    <linearGradient id="df-back" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#CFD1B7"/><stop offset=".68" stop-color="#AFBCA2"/><stop offset="1" stop-color="#7D947A"/></linearGradient>
    <linearGradient id="df-rock" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#92A28B" stop-opacity=".67"/><stop offset=".5" stop-color="#526E5B" stop-opacity=".83"/><stop offset="1" stop-color="#263D34"/></linearGradient>
  </defs>

