<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 191 226" role="img" aria-labelledby="title desc">
  <title id="title">The Double Fifth Festival</title>
  <desc id="desc">Soft river haze, quiet currents, and slender mugwort leaves suggest the stillness of an early summer river.</desc>
  <defs>
    <radialGradient id="river-light" cx=".56" cy=".52" r=".6">
      <stop stop-color="#dfb66f" stop-opacity=".3" />
      <stop offset="1" stop-color="#dfb66f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="river-wash" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9aa99a" stop-opacity=".38" />
      <stop offset="1" stop-color="#7f9687" stop-opacity=".14" />
    </linearGradient>
    <g id="mugwort-leaf" fill="#8da18d" fill-opacity=".44" stroke="#718675" stroke-opacity=".72" stroke-width=".4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0c-6 4-11 10-13 18 7-1 12-6 15-14Z" />
      <path d="M0 0-10 14" fill="none" stroke-width=".32" />
    </g>
    <g id="cloud-line" fill="none" stroke-linecap="round">
      <path d="M0 0c9-4 17-4 25-1m4 0c5-2 9-2 14-.8" stroke="#748779" stroke-opacity=".46" stroke-width=".58" />
      <path d="M3 3c8-2 14-2 20 0" stroke="#f6f1e6" stroke-width=".52" />
    </g>
  </defs>
  <g transform="translate(0 266) scale(1 -1)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="159" y="24" width="8" height="16" fill="#b95449" stroke="none" />
    <g fill="#fff8ec" font-family="serif" font-size="4.5" text-anchor="middle" stroke="none">
      <text x="163" y="37" transform="translate(0 74) scale(1 -1)">暗</text>
      <text x="163" y="32" transform="translate(0 64) scale(1 -1)">香</text>
      <text x="163" y="27" transform="translate(0 54) scale(1 -1)">集</text>
    </g>

    <!-- Early summer light dissolves into layered river haze -->
    <circle cx="132" cy="199" r="31" fill="url(#river-light)" stroke="none" />
    <path fill="#b9c4b5" fill-opacity=".25" stroke="none" d="M20 151c20-4 31 4 43 10 12 6 21 6 33 1 15-7 26-5 39 1 13 6 24 5 37-1v-27H20Z" />
    <path stroke="#768b7b" stroke-opacity=".54" stroke-width=".62" d="M22 151c18-4 30 4 41 10 12 6 21 6 33 1 15-7 26-5 39 1 12 6 24 5 35 0" />
    <path stroke="#d8dcd0" stroke-width=".58" d="M30 145c13-2 22 2 31 7m57 2c14-5 24-4 36 1" />
    <use href="#cloud-line" transform="translate(29 191) rotate(-4)" />
    <use href="#cloud-line" transform="translate(103 217) rotate(3) scale(.82)" />
    <use href="#cloud-line" transform="translate(121 179) rotate(-2) scale(.7)" />
    <path fill="#f2dfb8" fill-opacity=".12" stroke="none" d="M71 198c18-8 37-9 57-4 12 3 22 3 34 0v-7c-13 2-24 2-37-1-20-5-38-3-56 5Z" />

    <!-- The river is only a few soft, receding strokes -->
    <path fill="url(#river-wash)" fill-opacity=".58" stroke="none" d="M20 131c20 4 37 4 53 0 18-4 34-4 51 0 18 4 34 4 48 0v-12c-16 3-31 3-48 0-18-3-34-3-52 0-18 4-34 4-52 0Z" />
    <path stroke="#607668" stroke-opacity=".5" stroke-width=".58" d="M24 126c15 2 29 2 43-1m19-1c17-2 31-1 46 2m17 1c7 0 13 0 19-1" />
    <path stroke="#f7f2e6" stroke-opacity=".9" stroke-width=".62" d="M31 115c12 2 23 2 34 1m54-1c14-2 26-1 39 2" />
    <path stroke="#d9bd84" stroke-opacity=".42" stroke-width=".46" d="M65 109c10 1 18 1 27 0m17 0c8 0 15 .5 22 1" />
    <path stroke="#829586" stroke-opacity=".48" stroke-width=".44" d="M27 99c13 2 24 2 35 1m69-1c10-1 19 0 28 2" />
    <path stroke="#f7f2e6" stroke-opacity=".72" stroke-width=".46" d="M44 89c15 1 27 1 38-1m31 0c13-1 24 0 35 2" />

    <!-- Mugwort grows from the banks, slender and aromatic -->
    <path stroke="#667c6c" stroke-opacity=".64" stroke-width=".6" d="M35 63c4 18 7 37 10 56m-5-30c4 4 7 9 10 15m-7-29c-4 4-7 8-9 13m10-29c6 5 10 10 13 16" />
    <use href="#mugwort-leaf" transform="translate(45 87) rotate(28)" />
    <use href="#mugwort-leaf" transform="translate(39 78) rotate(-148) scale(.82)" />
    <use href="#mugwort-leaf" transform="translate(50 101) rotate(46) scale(.86)" />
    <use href="#mugwort-leaf" transform="translate(54 70) rotate(38) scale(.72)" />
    <path stroke="#87998a" stroke-opacity=".4" stroke-width=".5" d="M151 62c-3 18-5 35-5 55m2-27c-5 4-8 8-11 13m10-28c4 4 7 8 9 13m-11-31c-7 5-11 10-14 16" />
    <use href="#mugwort-leaf" transform="translate(146 88) rotate(-148) scale(.94)" opacity=".38" />
    <use href="#mugwort-leaf" transform="translate(149 78) rotate(28) scale(.82)" opacity=".55" />
    <use href="#mugwort-leaf" transform="translate(138 102) rotate(-133) scale(.84)" opacity=".55" />
    <use href="#mugwort-leaf" transform="translate(132 71) rotate(-142) scale(.72)" opacity=".55" />
    <path stroke="#809381" stroke-width=".46" d="M29 57c7-2 13-2 19 0m94-1c8-2 15-2 22 0" />
  </g>
</svg>
