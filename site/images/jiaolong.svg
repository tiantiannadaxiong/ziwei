  <path d="M760 394c-78 19-143 17-206 39-63 23-107 48-170 54-43 4-70-1-106-4 40 21 86 24 135 16 54-9 90-28 137-38 78-17 138-13 210-32Z" fill="#326B75" fill-opacity=".047"/>
