<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 191 226" role="img" aria-labelledby="title desc">
  <title id="title">Rivers at Moonrise</title>
  <desc id="desc">A pale moon and distant ridgelines hang above several quiet currents meeting in a field of river mist.</desc>
  <defs>
    <radialGradient id="moon-halo">
      <stop stop-color="#e8bf72" stop-opacity=".34" />
      <stop offset=".58" stop-color="#e8bf72" stop-opacity=".14" />
      <stop offset="1" stop-color="#e8bf72" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="moon-disc" x1=".15" y1=".1" x2=".85" y2=".9">
      <stop stop-color="#fff4d6" />
      <stop offset="1" stop-color="#e8d29b" />
    </linearGradient>
    <linearGradient id="distant-ink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a9b8a9" stop-opacity=".42" />
      <stop offset="1" stop-color="#718879" stop-opacity=".12" />
    </linearGradient>
    <g id="current-mark" fill="none" stroke-linecap="round">
      <path d="M0 0c8-3 14-3 21-.6" stroke="#f8f3e8" stroke-width=".72" />
      <path d="M2 3c7-2 12-1.7 17-.2" stroke="#688575" stroke-width=".42" />
    </g>
  </defs>
  <g transform="translate(0 266) scale(1 -1)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="159" y="24" width="8" height="16" fill="#b95449" stroke="none" />
    <g fill="#fff8ec" font-family="serif" font-size="4.5" text-anchor="middle" stroke="none">
      <text x="163" y="37" transform="translate(0 74) scale(1 -1)">暗</text>
      <text x="163" y="32" transform="translate(0 64) scale(1 -1)">香</text>
      <text x="163" y="27" transform="translate(0 54) scale(1 -1)">集</text>
    </g>

    <!-- Moon and distant ridges -->
    <circle cx="119" cy="196" r="36" fill="url(#moon-halo)" stroke="none" />
    <circle cx="119" cy="196" r="19" fill="url(#moon-disc)" stroke="#c7ac75" stroke-opacity=".42" stroke-width=".45" />
    <path d="M111 203c3 2 6 2 9 1m-15 3c1 1 2 1 3 1" stroke="#cdbb91" stroke-opacity=".55" stroke-width=".5" />
    <path fill="url(#distant-ink)" stroke="none" d="M18 145c9 2 17 13 26 14 8 1 13-6 20-5 7 1 11 13 19 13 8 0 12-10 20-10 9 0 14 16 23 16 10 0 15-13 26-15 9-2 17 4 22 2v-13c-9 2-15-5-25-2-11 3-16 14-26 13-10-1-15-17-24-17-10 0-13 11-21 11-8-1-12-13-20-14-8-1-12 6-20 5-8-1-14-10-20-12Z" />
    <path stroke="#758a7b" stroke-opacity=".56" stroke-width=".58" d="M22 145c9 2 15 12 23 14 8 2 12-5 19-5 7 0 11 12 18 13 8 1 11-10 19-11 9-1 13 16 22 17 10 1 15-13 25-15 10-2 17 4 24 2" />
    <path stroke="#a4b2a1" stroke-opacity=".55" stroke-width=".42" d="M33 146c5 3 8 7 12 8m29 6c4-1 7-3 10-6m28 12c4-.3 7-2 10-5m29-8c5-1 8 .2 12 2" />
    <path fill="#c6cec0" fill-opacity=".34" stroke="none" d="M18 132c22 6 37 4 55-2 18-7 34-7 51 0 17 7 31 6 49-1l-1-13c-17 5-30 4-47-2-18-6-34-5-53 2-18 7-34 8-54 2Z" />
    <path stroke="#9cad9d" stroke-opacity=".72" stroke-width=".56" d="M22 131c20 6 37 4 52-2 18-7 35-7 52 0 17 7 31 6 45 0" />
    <path stroke="#e9e6d9" stroke-width=".7" d="M28 123c14 4 24 4 36 1m51-2c14 5 27 5 40 2" />

    <!-- Water and mist settle into nearly still horizontal layers -->
    <path fill="#aebdae" fill-opacity=".16" stroke="none" d="M19 130c18 3 35 3 52 0 18-3 34-3 51 0 18 4 34 4 50 0v-9c-17 3-33 3-50 0-18-3-34-3-52 0-18 3-34 3-51 0Z" />
    <path stroke="#718779" stroke-opacity=".42" stroke-width=".5" d="M23 126c17 3 32 3 47 0m17-1c17-2 32-1 47 2m14 1c9 1 17 .5 26-1" />
    <path stroke="#f8f3e8" stroke-opacity=".92" stroke-width=".62" d="M31 118c13 2 25 2 37 0m22-1c15-1 27 0 40 2m16 1c9 1 16 1 24 0" />
    <path stroke="#91a293" stroke-opacity=".5" stroke-width=".42" d="M25 108c12-1 22 0 32 2m64-1c11-1 21 0 31 2m-79 0c6 0 11 .5 16 1" />

    <!-- Three currents open into the sea -->
    <use href="#current-mark" transform="translate(29 76) rotate(7)" />
    <use href="#current-mark" transform="translate(57 71) rotate(-3) scale(1.12)" />
    <use href="#current-mark" transform="translate(91 72) rotate(2) scale(.92)" />
    <use href="#current-mark" transform="translate(124 78) rotate(-4)" />
    <path stroke="#527b6b" stroke-width=".48" d="M27 66c20-4 34-3 48 1m11 2c21-2 37-1 55 3m-92-13c15-2 26-1 38 2m34 1c12-1 22 0 33 3" />
  </g>
</svg>
