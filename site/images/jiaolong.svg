<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">蛟龍：江海相逢</title>
  <desc id="desc">開闊青藍的江海在遠處漸漸淡入紙白。近岸低平的墨石與細草臨水，幾道水脈繞過石隙，在不規則的淺灘與回流間舒展；細長的波痕疏密相間，暗示水下深藏的力量。</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="250" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#326B75" stop-opacity=".025"/>
      <stop offset=".28" stop-color="#326B75" stop-opacity=".12"/>
      <stop offset=".66" stop-color="#326B75" stop-opacity=".34"/>
      <stop offset=".84" stop-color="#326B75" stop-opacity=".42"/>
      <stop offset="1" stop-color="#326B75" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shallows" x1="0" y1="0" x2="1" y2=".4">
      <stop stop-color="#6F8F76" stop-opacity=".25"/>
      <stop offset=".62" stop-color="#6F8F76" stop-opacity=".13"/>
      <stop offset="1" stop-color="#6F8F76" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#74836B" stop-opacity=".61"/>
      <stop offset=".4" stop-color="#425B4B" stop-opacity=".86"/>
      <stop offset="1" stop-color="#263D34"/>
    </linearGradient>
    <linearGradient id="wet-stone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6F8F76" stop-opacity=".6"/>
      <stop offset="1" stop-color="#263D34" stop-opacity=".84"/>
    </linearGradient>
  </defs>

