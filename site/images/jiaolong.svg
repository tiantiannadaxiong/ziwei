  <path d="M11 610c37 0 56 14 87 23 32 9 57 8 86 16 33 8 54 25 81 38 22 11 45 17 69 16-29 7-53 3-80-9-30-13-50-27-80-33-33-7-59-7-90-17-29-10-47-20-73-23Z" fill="#FFFDF5" fill-opacity=".71"/>
