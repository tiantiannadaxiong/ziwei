    <path d="M31 612c4-19 5-35 2-49m11 43c9-9 16-18 20-28" stroke-opacity=".55" stroke-width="1.05"/>
  </g>
  <path d="M22 582c-7-8-10-16-7-24 7 5 9 12 7 24Zm13 14c3-9 8-14 15-16-1 8-6 13-15 16Zm16 11c6-8 12-10 19-10-4 7-10 10-19 10Z" fill="#6F8F76" fill-opacity=".74"/>
  <path d="M252 379c13-2 22-1 31-4l-8 5-23 1Zm247-39 18-2 11 1-29 3Z" fill="#263D34" fill-opacity=".16"/>
</svg>
