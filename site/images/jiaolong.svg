    <path d="M103 603c32 4 58 13 81 24m32 13c28 10 41 22 61 33m20 10c18 7 34 10 50 9" stroke="#326B75" stroke-opacity=".52" stroke-width="1.2"/>
    <path d="M52 619c19 5 32 13 52 18m35 8c26 3 45 7 63 14m92 45c28 10 51 11 72 6" stroke="#FFFDF5" stroke-opacity=".92" stroke-width="2.1"/>
