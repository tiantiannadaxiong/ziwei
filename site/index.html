  <script>
    (() => {
      const root = document.documentElement;
      const viewport = window.visualViewport;
      const updateHeight = () => {
        const isStandalone = navigator.standalone
          || window.matchMedia("(display-mode: standalone)").matches;
        const visibleHeight = viewport?.height || window.innerHeight;
        // iOS standalone PWAs can report a visual viewport shorter than the
        // actual display, leaving the home-indicator area on the root canvas.
        const height = isStandalone
          ? Math.max(visibleHeight, window.innerHeight, window.screen?.height || 0)
          : visibleHeight;
        root.style.setProperty("--viewport-height", `${Math.ceil(height)}px`);
      };
      updateHeight();
      window.addEventListener("resize", updateHeight, { passive: true });
      window.addEventListener("orientationchange", updateHeight, { passive: true });
      window.addEventListener("pageshow", updateHeight, { passive: true });
      viewport?.addEventListener("resize", updateHeight, { passive: true });
    })();
  </script>
