  <script>
    // Keep the edition's established iPhone/PWA viewport behaviour. The page
    // scrolls inside the middle grid row; both navigation rows stay outside it.
    (() => {
      const root = document.documentElement;
      const viewport = window.visualViewport;
      const updateHeight = () => {
        const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
        const visible = viewport?.height || innerHeight;
        const height = standalone ? Math.max(visible, innerHeight, screen.height || 0) : visible;
        root.style.setProperty('--viewport-height', `${Math.ceil(height)}px`);
      };
      updateHeight();
      for (const event of ['resize', 'orientationchange', 'pageshow']) addEventListener(event, updateHeight, { passive: true });
      viewport?.addEventListener('resize', updateHeight, { passive: true });
    })();
  </script>
